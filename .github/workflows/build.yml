name: Crear APK desde Web App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar dependencias y compilar web
        run: |
          npm install
          npm run build

      - name: Convertir web a proyecto Android (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MiApp" "com.ai.miapp" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Compilar archivo APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v5
        with:
          name: mi-app-android
          path: android/app/build/outputs/apk/debug/*.apk
